<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>J.A.R.V.I.S Mobile Edition</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>J.A.R.V.I.S</h1>
        <p>MOBILE EDITION</p>
    </header>


    <!-- JARVIS CORE -->
    <div class="core">

        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="center"></div>

    </div>

    <p class="core-text">
        CORE ACTIVE
    </p>


    <!-- STATUS -->
    <div class="status">

        <h2>SYSTEM STATUS</h2>

        <div class="row">
            <span>AI CORE</span>
            <b class="on">● ONLINE</b>
        </div>

        <div class="row">
            <span>NETWORK</span>
            <b class="on">● ONLINE</b>
        </div>

        <div class="row">
            <span>VOICE</span>
            <b class="on">● ONLINE</b>
        </div>

        <div class="row">
            <span>MEMORY</span>
            <b class="on">● ONLINE</b>
        </div>

    </div>


    <!-- CHAT -->
    <div
        class="chat"
        id="chat"
    ></div>


    <!-- INPUT -->
    <div class="input-area">

        <input
            type="text"
            id="msg"
            placeholder="Ask J.A.R.V.I.S..."
            autocomplete="off"
        >

        <button
            id="send"
            type="button"
        >
            SEND
        </button>

        <button
            id="mic-btn"
            type="button"
            title="Voice"
        >
            🎤
        </button>

        <button
            id="clear-btn"
            type="button"
            title="Clear Memory"
        >
            🧹
        </button>

        <button
            id="cam-btn"
            type="button"
            title="Camera / Gallery"
        >
            📷
        </button>

        <!-- CAMERA / GALLERY INPUT -->
        <input
            type="file"
            id="img-input"
            accept="image/*"
            style="display:none"
        >

    </div>


    <!-- JAVASCRIPT -->
    <script src="./script.js"></script>

</body>

</html>
